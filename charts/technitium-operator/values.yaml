## @section Global

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/charg/technitium-operator
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

## @section CRDs

crds:
  # Install the operator's CustomResourceDefinitions as part of this chart.
  install: true
  # Annotate the CRDs so `helm uninstall` does not delete them (and the
  # resources stored under them) along with the release.
  keep: true

## @section RBAC / ServiceAccount

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  # Create the ClusterRole/ClusterRoleBinding and leader-election Role/RoleBinding
  # required by the controller manager.
  create: true
  # Create <kind>-admin/<kind>-editor/<kind>-viewer ClusterRoles for every
  # operator kind, which cluster admins can bind to users/groups to delegate
  # access. These are not used by the operator itself.
  helperRoles: true

## @section Pod configuration

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 10

## @section Admission webhook

webhook:
  # Enable the validating/defaulting admission webhooks for the operator's resources.
  # Requires cert-manager in the cluster to issue the serving certificate.
  enabled: false
  # Port the webhook server listens on inside the container.
  port: 9443
  # Fail (deny the request) or Ignore (admit) when the webhook is unreachable.
  failurePolicy: Fail
  certManager:
    # Create a self-signed Issuer and Certificate for the webhook. Set to false
    # to supply your own Certificate that writes the `webhook-server-cert` Secret.
    enabled: true

## @section Manager configuration

leaderElection:
  enabled: true

healthProbe:
  port: 8081

## @section Metrics

metrics:
  # Expose the /metrics endpoint over HTTPS (authenticated via TokenReview/SubjectAccessReview).
  enabled: true
  port: 8443
  service:
    annotations: {}
  serviceMonitor:
    # Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    interval: ""
    scrapeTimeout: ""
    additionalLabels: {}
    tlsConfig:
      insecureSkipVerify: true

## @section NetworkPolicy

networkPolicy:
  # Restrict ingress to the /metrics endpoint to namespaces labeled `metrics: enabled`.
  enabled: false

## @section Extra customization

extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
