{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: clusters.dns.packet.fail
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
spec:
  group: dns.packet.fail
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterDomain
      name: Domain
      type: string
    - jsonPath: .spec.primary.name
      name: Primary
      type: string
    - jsonPath: .status.members
      name: Members
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is the Schema for the clusters API.

          Cluster is cluster-scoped: a Technitium cluster is server-global state shared
          across nodes, not something a Kubernetes namespace owns.

          Deletion orphans the server-side cluster. Removing a Cluster resource stops
          reconciliation but leaves the running DNS cluster intact; tearing down a live
          cluster on resource deletion is unsafe and is left to a deliberate manual
          operation. There is therefore no finalizer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Cluster
            properties:
              clusterDomain:
                description: |-
                  clusterDomain is the DNS name of the cluster, for example
                  "cluster.example.com". It is required and immutable: the domain is baked
                  into server-side cluster zones at initialization and cannot be changed in
                  place.
                maxLength: 253
                pattern: ^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)*[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: clusterDomain is immutable
                  rule: self == oldSelf
              ignoreCertificateErrors:
                default: false
                description: |-
                  ignoreCertificateErrors skips TLS verification when a secondary contacts
                  the primary to join. Initializing a cluster switches the primary to a
                  self-signed certificate, so a join against a primary without a trusted CA
                  needs this set to true.
                type: boolean
              primary:
                description: primary is the node initialized as the cluster's primary,
                  required.
                properties:
                  credentialsSecretRef:
                    description: |-
                      credentialsSecretRef references the Secret with this node's admin
                      credentials, required. The primary's Secret must carry a username and
                      password, not only a token: joining a secondary requires the primary's
                      local administrator credentials, which the server will not accept as a
                      token.
                    properties:
                      name:
                        description: |-
                          name is the Secret name, required. The Secret carries either a "token" key
                          or a "username"/"password" pair, the same shape the operator's connection
                          config uses.
                        type: string
                      namespace:
                        description: |-
                          namespace is the Secret's namespace. Because Cluster is cluster-scoped it
                          has no namespace of its own, so this defaults to the operator's namespace
                          when left empty.
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      endpoint is the base URL of the node's Technitium API, for example
                      "https://ns1.internal:5380", required.
                    pattern: ^https?://.+
                    type: string
                  ipAddresses:
                    description: |-
                      ipAddresses are the node's own reachable addresses advertised to cluster
                      peers, required. The primary's addresses let secondaries contact it; each
                      secondary's addresses let the primary reach it.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  name:
                    description: |-
                      name is a stable identifier for the node, required. It is used in status
                      and to key the node in the desired-state list; it does not have to match
                      the server's DNS domain name.
                    maxLength: 253
                    type: string
                required:
                - credentialsSecretRef
                - endpoint
                - ipAddresses
                - name
                type: object
              secondaries:
                description: |-
                  secondaries are the nodes joined to the cluster as secondaries. Each is
                  joined once, idempotently, after the primary is initialized.
                items:
                  description: |-
                    ClusterNodeSpec describes one Technitium server participating in the cluster:
                    how to reach it and where its admin credentials live.
                  properties:
                    credentialsSecretRef:
                      description: |-
                        credentialsSecretRef references the Secret with this node's admin
                        credentials, required. The primary's Secret must carry a username and
                        password, not only a token: joining a secondary requires the primary's
                        local administrator credentials, which the server will not accept as a
                        token.
                      properties:
                        name:
                          description: |-
                            name is the Secret name, required. The Secret carries either a "token" key
                            or a "username"/"password" pair, the same shape the operator's connection
                            config uses.
                          type: string
                        namespace:
                          description: |-
                            namespace is the Secret's namespace. Because Cluster is cluster-scoped it
                            has no namespace of its own, so this defaults to the operator's namespace
                            when left empty.
                          type: string
                      required:
                      - name
                      type: object
                    endpoint:
                      description: |-
                        endpoint is the base URL of the node's Technitium API, for example
                        "https://ns1.internal:5380", required.
                      pattern: ^https?://.+
                      type: string
                    ipAddresses:
                      description: |-
                        ipAddresses are the node's own reachable addresses advertised to cluster
                        peers, required. The primary's addresses let secondaries contact it; each
                        secondary's addresses let the primary reach it.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    name:
                      description: |-
                        name is a stable identifier for the node, required. It is used in status
                        and to key the node in the desired-state list; it does not have to match
                        the server's DNS domain name.
                      maxLength: 253
                      type: string
                  required:
                  - credentialsSecretRef
                  - endpoint
                  - ipAddresses
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - clusterDomain
            - primary
            type: object
          status:
            description: status defines the observed state of Cluster
            properties:
              clusterDomain:
                description: clusterDomain is the cluster domain observed on the primary
                  node.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the Cluster resource.

                  Condition types set by the controller:
                  - "Ready": every node in the spec is a cluster member
                  - "Progressing": the controller is initializing or joining nodes
                  - "Degraded": a reconcile failed, with the cause in reason/message
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              members:
                description: |-
                  members summarizes observed membership as "joined/total", for example
                  "2/3" while one node is still converging.
                type: string
              nodes:
                description: nodes reports per-node observed membership, primary first.
                items:
                  description: |-
                    ClusterNodeStatus is the observed membership of a single node, read from that
                    node's own /api/admin/cluster/state.
                  properties:
                    lastSyncedTime:
                      description: |-
                        lastSyncedTime is when this node's membership was last confirmed against
                        the server.
                      format: date-time
                      type: string
                    member:
                      description: |-
                        member reports whether the node's own state shows it as an initialized
                        cluster member.
                      type: boolean
                    message:
                      description: |-
                        message describes the last observation, carrying the error when the node
                        could not be reached or reconciled.
                      type: string
                    name:
                      description: name is the node identifier from the spec.
                      type: string
                    role:
                      description: |-
                        role is the observed cluster role, "Primary" or "Secondary", empty until
                        the node is a member.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
