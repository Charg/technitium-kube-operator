{{- if .Values.rbac.create }}
---
# permissions to do leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "technitium-operator.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "technitium-operator.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "technitium-operator.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "technitium-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "technitium-operator.fullname" . }}-manager-role
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - dns.packet.fail
  resources:
  - zones
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dns.packet.fail
  resources:
  - zones/finalizers
  verbs:
  - update
- apiGroups:
  - dns.packet.fail
  resources:
  - zones/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "technitium-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "technitium-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "technitium-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.metrics.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "technitium-operator.fullname" . }}-metrics-auth-role
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "technitium-operator.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "technitium-operator.fullname" . }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ include "technitium-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "technitium-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}
{{- if .Values.rbac.zoneAggregateRoles }}
---
# This rule is not used by technitium-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over dns.packet.fail.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "technitium-operator.fullname" . }}-zone-admin-role
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - dns.packet.fail
  resources:
  - zones
  verbs:
  - '*'
- apiGroups:
  - dns.packet.fail
  resources:
  - zones/status
  verbs:
  - get
---
# This rule is not used by technitium-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within dns.packet.fail.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "technitium-operator.fullname" . }}-zone-editor-role
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - dns.packet.fail
  resources:
  - zones
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dns.packet.fail
  resources:
  - zones/status
  verbs:
  - get
---
# This rule is not used by technitium-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dns.packet.fail resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "technitium-operator.fullname" . }}-zone-viewer-role
  labels:
    {{- include "technitium-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - dns.packet.fail
  resources:
  - zones
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dns.packet.fail
  resources:
  - zones/status
  verbs:
  - get
{{- end }}
{{- end }}
