# Placeholder credentials Secret so the manager starts under `just deploy`.
# Replace the token with a real Technitium API token, or supply username and
# password keys instead. Production installs should use the Helm chart's
# technitium.existingSecret to point at a Secret managed out of band.
apiVersion: v1
kind: Secret
metadata:
  name: credentials
type: Opaque
stringData:
  token: placeholder
