---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-dns-packet-fail-v1alpha1-record
  failurePolicy: Fail
  name: mrecord-v1alpha1.kb.io
  rules:
  - apiGroups:
    - dns.packet.fail
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - records
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-dns-packet-fail-v1alpha1-zone
  failurePolicy: Fail
  name: mzone-v1alpha1.kb.io
  rules:
  - apiGroups:
    - dns.packet.fail
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - zones
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-dns-packet-fail-v1alpha1-record
  failurePolicy: Fail
  name: vrecord-v1alpha1.kb.io
  rules:
  - apiGroups:
    - dns.packet.fail
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - records
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-dns-packet-fail-v1alpha1-zone
  failurePolicy: Fail
  name: vzone-v1alpha1.kb.io
  rules:
  - apiGroups:
    - dns.packet.fail
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - zones
  sideEffects: None
