---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dnssecs.dns.packet.fail
spec:
  group: dns.packet.fail
  names:
    kind: DNSSEC
    listKind: DNSSECList
    plural: dnssecs
    singular: dnssec
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .spec.algorithm
      name: Algorithm
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNSSEC is the Schema for the dnssecs API.

          DNSSEC is namespaced, matching Record and Blocklist: it configures a zone on
          a referenced TechnitiumCluster by name and lives in whichever namespace owns
          the configuration, independent of Zone's cluster-scoped zone namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DNSSEC
            properties:
              algorithm:
                description: algorithm is the signing key algorithm.
                enum:
                - RSA
                - ECDSA
                type: string
              curve:
                description: |-
                  curve is the elliptic curve backing the ECDSA signing keys. Only
                  meaningful when algorithm is ECDSA; the webhook rejects it set alongside
                  RSA.
                enum:
                - P256
                - P384
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy controls what happens to the zone's signed state when
                  this resource is deleted. "Delete" (the default) unsigns the zone on
                  the Technitium server. "Orphan" leaves the zone signed and only clears
                  the finalizer, which is useful for safe adoption or migration.
                enum:
                - Delete
                - Orphan
                type: string
              dnsKeyTtl:
                description: |-
                  dnsKeyTtl is the TTL, in seconds, of the zone's DNSKEY records. Left
                  unchanged on the server when unset.
                format: int32
                type: integer
              hashAlgorithm:
                description: |-
                  hashAlgorithm is the hash function backing the RSA signing keys. Only
                  meaningful when algorithm is RSA; the webhook rejects it set alongside
                  ECDSA.
                enum:
                - SHA256
                - SHA384
                - SHA512
                type: string
              kskKeySize:
                description: |-
                  kskKeySize is the Key Signing Key size, in bits, for RSA. Only
                  meaningful when algorithm is RSA; the webhook rejects it set alongside
                  ECDSA.
                format: int32
                type: integer
              nsec3Iterations:
                description: |-
                  nsec3Iterations is the NSEC3 hash iteration count. Only meaningful when
                  nsecType is NSEC3.
                format: int32
                type: integer
              nsec3SaltLength:
                description: |-
                  nsec3SaltLength is the NSEC3 salt length, in bytes. Only meaningful when
                  nsecType is NSEC3.
                format: int32
                type: integer
              nsecType:
                default: NSEC
                description: nsecType is the proof-of-nonexistence mechanism the signed
                  zone uses.
                enum:
                - NSEC
                - NSEC3
                type: string
              serverRef:
                description: |-
                  serverRef names the TechnitiumCluster the zone to sign lives on. The
                  referenced instance must be Ready. Only name is used: a TechnitiumCluster
                  is cluster-scoped, so the webhook rejects serverRef.namespace if set.
                properties:
                  name:
                    description: name is the Secret's name.
                    type: string
                  namespace:
                    description: |-
                      namespace is the Secret's namespace. Defaults to the operator's own
                      namespace when empty, since credential Secrets are typically colocated
                      with the operator rather than scattered across tenant namespaces.
                    type: string
                required:
                - name
                type: object
              zone:
                description: |-
                  zone is the name of the existing authoritative zone to sign, for example
                  "example.com". It is required and immutable: re-pointing a DNSSEC
                  resource at a different zone is not a safe in-place operation, since it
                  would unsign one zone and sign another under a single resource identity.
                  Delete and recreate the resource to target a different zone.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: zone is immutable
                  rule: self == oldSelf
              zskKeySize:
                description: |-
                  zskKeySize is the Zone Signing Key size, in bits, for RSA. Only
                  meaningful when algorithm is RSA; the webhook rejects it set alongside
                  ECDSA.
                format: int32
                type: integer
              zskRolloverDays:
                description: |-
                  zskRolloverDays is how often, in days, the server automatically rolls
                  the Zone Signing Key over. Zero disables automatic rollover. Left
                  unchanged on the server when unset.
                format: int32
                type: integer
            required:
            - algorithm
            - serverRef
            - zone
            type: object
          status:
            description: status defines the observed state of DNSSEC
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the DNSSEC resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Condition types set by the controller:
                  - "Ready": the zone is signed and matches the spec's nsecType
                  - "Progressing": the controller is signing the zone
                  - "Degraded": a reconcile failed, with the cause in reason/message

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  reconciled. A value behind .metadata.generation means the observed state
                  is stale.
                format: int64
                type: integer
              signed:
                description: |-
                  signed reports whether the zone currently carries any DNSSEC signature
                  (NSEC or NSEC3), as last observed on the Technitium server.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
