    controller-gen.kubebuilder.io/version: v0.22.0
  name: serversettings.dns.packet.fail
spec:
  group: dns.packet.fail
  names:
    kind: ServerSettings
    listKind: ServerSettingsList
    plural: serversettings
    singular: serversettings
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServerSettings is the Schema for the serversettings API.

          ServerSettings is namespaced, matching Record: it configures a referenced
          TechnitiumCluster by name and lives in whichever namespace owns the
          configuration, rather than contending for a single cluster-scoped name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ServerSettings
            properties:
              cache:
                description: cache configures the resolver cache.
                properties:
                  maximumRecordTtlSeconds:
                    description: maximumRecordTtlSeconds caps the TTL a cached record
                      may have.
                    format: int32
                    minimum: 0
                    type: integer
                  minimumRecordTtlSeconds:
                    description: minimumRecordTtlSeconds floors the TTL a cached record
                      may have.
                    format: int32
                    minimum: 0
                    type: integer
                  serveStale:
                    description: |-
                      serveStale enables serving expired records from cache when upstreams are
                      unreachable.
                    type: boolean
                  serveStaleTtlSeconds:
                    description: |-
                      serveStaleTtlSeconds is how long, in seconds, an expired record is kept
                      usable for stale answers before it is dropped from cache.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  deletionPolicy controls what happens to the applied settings when this
                  resource is deleted. Defaults to Retain, which leaves them in place.
                enum:
                - Retain
                type: string
              forwarders:
                description: forwarders configures upstream query forwarding.
                properties:
                  addresses:
                    description: |-
                      addresses is the list of upstream resolvers to forward to, for example
                      ["1.1.1.1", "8.8.8.8"]. An empty list clears all forwarders, returning
                      the server to performing its own recursive resolution.
                    items:
                      type: string
                    type: array
                  protocol:
                    description: |-
                      protocol is the transport used to reach the forwarders. Left unchanged on
                      the server when unset.
                    enum:
                    - Udp
                    - Tcp
                    - Tls
                    - Https
                    - Quic
                    type: string
                type: object
              logging:
                description: logging configures query and file logging.
                properties:
                  enabled:
                    description: enabled turns file logging of error and audit entries
                      on or off.
                    type: boolean
                  logQueries:
                    description: |-
                      logQueries logs every query and its response. This is verbose and
                      off by default on the server.
                    type: boolean
                  maxFileDays:
                    description: |-
                      maxFileDays is how many days of log files to keep. 0 disables automatic
                      deletion.
                    format: int32
                    minimum: 0
                    type: integer
                  useLocalTime:
                    description: useLocalTime writes log timestamps in local time
                      instead of UTC.
                    type: boolean
                type: object
              recursion:
                description: recursion configures the recursion policy.
                properties:
                  networkACL:
                    description: |-
                      networkACL is the ordered access control list of IP or network addresses
                      used only when policy is UseSpecifiedNetworkACL. Prefix an entry with "!"
                      to deny it. An empty list clears the ACL.
                    items:
                      type: string
                    type: array
                  policy:
                    description: policy sets which clients recursion is allowed for.
                    enum:
                    - Deny
                    - Allow
                    - AllowOnlyForPrivateNetworks
                    - UseSpecifiedNetworkACL
                    type: string
                required:
                - policy
                type: object
              serverRef:
                description: |-
                  serverRef names the TechnitiumCluster these settings are applied to. The
                  referenced instance must be Ready. Only name is used: a TechnitiumCluster
                  is cluster-scoped, so the webhook rejects serverRef.namespace if set.
                properties:
                  name:
                    description: name is the Secret's name.
                    type: string
                  namespace:
                    description: |-
                      namespace is the Secret's namespace. Defaults to the operator's own
                      namespace when empty, since credential Secrets are typically colocated
                      with the operator rather than scattered across tenant namespaces.
                    type: string
                required:
                - name
                type: object
            required:
            - serverRef
            type: object
          status:
            description: status defines the observed state of ServerSettings
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the ServerSettings resource.

                  Condition types set by the controller:
                  - "Ready": the settings have been applied and match the spec
                  - "Progressing": the controller is applying the settings
                  - "Degraded": a reconcile failed, with the cause in reason/message
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observed:
                description: |-
                  observed reflects the managed settings as the server reported them on the
                  last successful reconcile.
                properties:
                  cacheMaximumRecordTtlSeconds:
                    format: int32
                    type: integer
                  cacheMinimumRecordTtlSeconds:
                    format: int32
                    type: integer
                  forwarderProtocol:
                    type: string
                  forwarders:
                    items:
                      type: string
                    type: array
                  logQueries:
                    type: boolean
                  loggingEnabled:
                    type: boolean
                  maxLogFileDays:
                    format: int32
                    type: integer
                  recursion:
                    type: string
                  recursionNetworkACL:
                    items:
                      type: string
                    type: array
                  serveStale:
                    type: boolean
                  serveStaleTtlSeconds:
                    format: int32
                    type: integer
                  useLocalTime:
                    type: boolean
                type: object
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
