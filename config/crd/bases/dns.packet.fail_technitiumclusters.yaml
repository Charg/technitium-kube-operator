                  credentials. When unset, the operator generates a "<name>-admin" Secret
                  with a random password, owned by the cluster. With storage.retentionPolicy
                  "Retain" (the default) that generated Secret outlives the TechnitiumCluster
                  alongside the data PVCs, and a cluster recreated with the same name
                  re-adopts it. A Secret referenced here is never deleted by the operator
                  on cluster deletion. The Secret must live in the operator's namespace,
                  because the pods mount it from there: namespace must be empty or equal
                  to the operator's namespace, and any other value marks the cluster
                  Degraded with reason InvalidAdminSecretRef. It must contain "username"
                  and "password" keys, and the operator writes a "token" key back into it
                  once it has minted the admin API token.
